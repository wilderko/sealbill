<span class="file-pick" data-file-pick><input id="{{ input_id }}" name="{{ input_name }}" type="file"{% if accept %} accept="{{ accept }}"{% endif %} class="file-pick__input">
<label for="{{ input_id }}" class="btn btn--sm file-pick__button" aria-hidden="true">{{ choose_label }}</label>
<span class="file-pick__name" data-file-name data-empty="{{ empty_label }}">{{ empty_label }}</span></span>
